[project]
name = "autovideo"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6",
  "python-dotenv>=1",
  "google-genai>=3.1.0",
  "jsonschema>=4.26.0",
  "edge-tts>=7.3.1",
  "pythainlp>=5.4.0",
  "python-telegram-bot>=22.8",
  "google-api-python-client>=2.202.0",
  "google-auth-oauthlib>=1.5.0",
]

[project.scripts]
autovideo = "autovideo.cli:main"

[project.optional-dependencies]
gpu = [
    "accelerate>=1.15.0",
    "bitsandbytes>=0.50.2",
    "diffusers>=0.43.0",
    "opencv-python-headless>=5.0.0.93",
    "peft>=0.21.2",
    "protobuf>=7.36.2",
    "sentencepiece>=0.2.3",
    "torch>=2.15.0",
    "transformers>=5.22.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autovideo"]
